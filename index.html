<style>
/* 介面沿用節目網站的米白粗框風格；冒險畫面本身是像素風（全部用程式畫，沒有圖檔） */
:root{
  --page:#f4efe6; --ink:#1b1a18; --muted:#6e675c; --paper:#ffffff; --line:#e6dfd2;
  --amber:#edb65a; --hl:#ffe45c; --blue:#8ccbe6;
  --ok:#2f9e5b; --ok-bg:#dcf3e4; --no:#c4452f; --no-bg:#f9dfd8;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit}
button{font-family:inherit;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- 頁首（做小一點，手機一個畫面就看得到遊戲和題目） ---------- */
header{padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:48px;height:48px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:29px;color:#fff;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);text-decoration:none}
.brand .grow{flex:1;min-width:0}
@media (max-width:380px){ .hbtn{font-size:12px;padding:2px 8px} }
.brand h1{margin:0;font-weight:900;font-size:clamp(20px,5vw,28px);letter-spacing:.04em;line-height:1.2}
.brand h1 .nw{display:inline-block;white-space:nowrap}
.brand .full{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.brand .full b{color:var(--ink);background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%);padding:0 3px}

/* ---------- 遊戲畫面 ---------- */
.stage{border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;background:var(--paper)}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#1d2b53;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;padding:7px 12px;border-top:3px solid var(--ink)}
.hud .lv{grid-row:span 2;font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;line-height:1}
.hud .lv small{font-size:.45em;display:block;color:var(--muted);margin-bottom:2px}
.hud .floor{grid-row:span 2;text-align:right;font-weight:900;font-size:15px;white-space:nowrap}
.hud .floor span{background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%);padding:0 4px}
.meter{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
.meter i{font-style:normal;width:28px}
.meter .track{flex:1;height:12px;overflow:hidden;border:2px solid var(--ink);border-radius:999px;background:var(--page)}
.meter .fill{height:100%;width:0;transition:width .35s}
.meter .hp{background:var(--no)} .meter .xp{background:var(--amber)}
.meter b{min-width:50px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 對話框 ---------- */
.dlg{margin-top:12px;padding:14px 16px 16px;min-height:270px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.dlg .who{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .who b{color:var(--ink)}
.dlg .q{margin:0 0 10px;font-size:clamp(16.5px,4.3vw,19px);font-weight:900;line-height:1.5}
.dlg .q:focus,.dlg .msg:focus{outline:none}
.dlg .msg{margin:0 0 4px;font-size:19px;font-weight:900}
.dlg p{margin:0 0 6px}
.dlg .sub{font-size:14.5px;color:var(--muted)}
.dlg .sub b{color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:15.5px;font-weight:700;line-height:1.4;padding:8px 12px 8px 9px;cursor:pointer;
  border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--page);display:grid;place-items:center;
  font-family:"Bebas Neue",Impact,sans-serif;font-size:18px;line-height:1;padding-top:2px}
.opt:not(:disabled):hover{background:#fff6c4}
.opt:not(:disabled):active{transform:translate(3px,3px);box-shadow:none}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no);box-shadow:3px 3px 0 var(--no)}
.opt.wrong .k{background:var(--no);color:#fff;border-color:var(--no)}
.opt.dim{opacity:.45;box-shadow:none}
.fb{margin:16px 0 0;font-size:14.5px}
.fb b{font-size:16px}
.fb b.ok{color:var(--ok)} .fb b.no{color:var(--no)}
.fb a{font-weight:700;white-space:nowrap;font-size:13.5px}
.go{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px 12px;margin-top:12px}
.go.left{justify-content:flex-start}
.btn{font-weight:900;font-size:17px;padding:7px 22px;cursor:pointer;border:3px solid var(--ink);border-radius:12px;background:var(--amber);box-shadow:4px 4px 0 var(--ink);letter-spacing:.04em}
.btn.alt{background:var(--paper);font-size:15px;padding:6px 14px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:0}
.rank{display:inline-block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;padding:0 6px;background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 94%,transparent 94%)}
.said{font-size:13px;color:var(--muted);min-height:1.6em;margin:8px 0 0;text-align:right}
.keys{font-size:12.5px;color:var(--muted);margin:10px 2px 0;text-align:right}
@media (hover:none){ .keys{display:none} }

/* ---------- 道具、連擊、天賦、語錄、集數足跡 ---------- */
.hbtn{flex:none;align-self:center;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.hbtn:hover{background:var(--hl)}
.hbtns{flex:none;display:flex;flex-direction:row;align-items:center;gap:6px;margin-left:auto}
.brand{flex-wrap:wrap}
@media (max-width:640px){ .hbtns{flex-basis:100%;justify-content:flex-end;margin-top:-2px} }
.hbtn[aria-pressed=false]{color:var(--muted);background:var(--page)}
.hbtn span{font-variant-numeric:tabular-nums}
.items{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px}
.item{display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:3px 4px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;min-width:0}
.item img{width:18px;height:18px;image-rendering:pixelated;flex:none}
.item span{overflow:hidden;text-overflow:ellipsis}
.item b{font-family:"Bebas Neue",Impact,sans-serif;font-size:16px;line-height:1;background:var(--hl);border-radius:6px;padding:1px 4px 0}
.item:not(:disabled):hover{background:#fff6c4}
.item:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.item:disabled{opacity:.45;box-shadow:none;cursor:default}
@media (max-width:440px){ .items{gap:4px} .item{padding:3px 2px;font-size:12px;gap:3px} .item img{display:none} .item b{font-size:15px} }
.note{margin:8px 0 0;padding:6px 12px;background:var(--hl);border:2px solid var(--ink);border-radius:10px;font-weight:700;font-size:14px}
.opt.gone{opacity:.25;box-shadow:none;text-decoration:line-through}
.hint{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 10px;background:#eef7fb;border:2px dashed var(--ink);border-radius:12px}
.hint img{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);flex:none;object-fit:cover;background:#fff}
.hint p{margin:0;font-size:15px}
.hint small{display:block;color:var(--muted);font-size:12px}
.extra{margin:8px 0 0;font-size:14px;color:var(--ink)}
.extra b{margin-right:4px}
.extra b.crit{color:#d9480f}
.extra b.new{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 92%,transparent 92%);padding:0 2px}
.perks{display:grid;gap:10px;margin-top:10px}
.perk{display:grid;gap:2px;text-align:left;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:10px 14px;cursor:pointer}
.perk b{font-size:17px;font-weight:900}
.perk span{font-size:14.5px}
.perk small{color:var(--muted);font-size:12.5px}
.perk:hover{background:#fff6c4}
.perk:active{transform:translate(3px,3px);box-shadow:none}
.quote{display:flex;gap:12px;align-items:flex-start;margin:10px 0 12px;padding:10px 12px;background:var(--page);border:2px solid var(--ink);border-radius:12px}
.quote img{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);object-fit:cover;flex:none;background:#fff}
.quote blockquote{margin:0;min-width:0}
.quote p{margin:0;font-weight:700;font-size:15.5px;line-height:1.6}
.quote footer{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.quote footer a{font-weight:700;color:var(--ink);white-space:nowrap}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(27,26,24,.55);display:grid;place-items:center;padding:16px}
.sheet{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px 16px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h2{margin:0;font-size:20px;font-weight:900}
.card-img{display:block;width:100%;max-height:min(62vh,620px);object-fit:contain;margin:10px 0 4px;border:2px solid var(--ink);border-radius:10px;background:var(--page)}
.card-go{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:10px}
.card-go .said{flex-basis:100%;margin:0}
.x{border:2px solid var(--ink);background:var(--paper);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer;font-weight:700}
.sheet .sub small{display:block;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:6px 0 8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;padding:0}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.ep{border:2px solid var(--ink);border-radius:6px;background:var(--page);color:var(--muted);font-family:"Bebas Neue",Impact,"Noto Sans TC",sans-serif;font-size:15px;line-height:1;padding:6px 0 4px;cursor:pointer;display:block}
.ep.lit{background:var(--amber);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.ep.none{border-style:dashed;border-color:#b9b1a3;background:transparent;color:#b9b1a3}
.ep:hover{outline:2px solid var(--blue)}
.foot-info{margin:12px 0 0;font-size:14px;min-height:3.2em}
.foot-info a{font-weight:700}

footer{margin:34px 0 30px;font-size:12.5px;color:var(--muted);line-height:1.8}
footer a{font-weight:700;color:var(--ink)}

/* ---------- 動態背景 ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg .tone{position:absolute;inset:-60px;background-image:radial-gradient(rgba(27,26,24,.075) 1.6px,transparent 1.8px);background-size:22px 22px;
  animation:tone 28s linear infinite;will-change:transform}
@keyframes tone{to{transform:translate(22px,22px)}}
@media (max-width:760px){ .bg .tone{opacity:.8} }
@media (prefers-reduced-motion: reduce){ .bg .tone{animation:none !important} }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="tone"></div></div>
<div class="wrap">
  <header>
    <div class="brand">
      <a class="logo" href="https://spiritboyaway.github.io/podcast-search/" aria-label="回到關鍵字搜尋">隱</a>
      <div class="grow">
        <h1><span class="nw">神隱少年團</span><span class="nw">QA大冒險</span></h1>
        <p class="full"><b>答對攻擊、答錯被打</b>　看你能闖到第幾關</p>
      </div>
      <div class="hbtns">
        <button class="hbtn" id="foot-btn" type="button">集數足跡 <span id="foot-n"></span></button>
        <button class="hbtn" id="snd-btn" type="button" aria-pressed="true">音效：開</button>
        <button class="hbtn" id="bgm-btn" type="button" aria-pressed="true">音樂：開</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" width="256" height="144" role="img" aria-label="像素風冒險畫面：二百五和鳳梨索在路上前進"></canvas>
    <div class="hud">
      <div class="lv"><small>LV</small><span id="h-lv">1</span></div>
      <div class="meter"><i>HP</i><div class="track"><div class="fill hp" id="h-hp"></div></div><b id="h-hpn"></b></div>

      <div class="meter"><i>EXP</i><div class="track"><div class="fill xp" id="h-xp"></div></div><b id="h-xpn"></b></div>

  <section class="dlg" id="dlg" aria-live="polite"><p class="sub">題庫載入中…</p></section>

  <div class="ovl" id="foot" hidden role="dialog" aria-modal="true" aria-labelledby="foot-h">

      <div class="legend"><span><i class="ep lit"></i>已點亮</span><span><i class="ep"></i>還沒點亮</span><span><i class="ep none"></i>還沒有題目</span></div>
      <div class="foot-grid" id="foot-grid"></div>

  <div class="ovl" id="card" hidden role="dialog" aria-modal="true" aria-labelledby="card-h">
    <div class="sheet">
      <div class="sheet-top"><h2 id="card-h">分享成績圖</h2><button class="x" id="card-x" type="button" aria-label="關閉">×</button></div>
      <img class="card-img" id="card-img" alt="">
      <div class="card-go">
        <button class="btn alt" id="card-copy" type="button">複製文字</button>
        <button class="btn alt" id="card-dl" type="button">下載圖片</button>
        <button class="btn" id="card-share" type="button" hidden>分享…</button>
        <p class="said" id="card-said" role="status"></p>
      </div>
    </div>
  </div>

  <footer>
    題目由 AI 根據逐字稿出題、主持人審核；逐字稿為自動整理，題目或答案如果有誤，歡迎到節目社群告訴我們。<br>
    冒險進度只存在你自己的瀏覽器。完整節目請到 <a href="https://spiritboyaway.firstory.cc" target="_blank" rel="noopener">Firstory</a> 或各大 Podcast 平台收聽。<br>

    <span id="built"></span>
  </footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RMOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SITE_URL = "https://spiritboyaway.github.io/quiz/";
const STORE = "spiritboy-quest-v1";

/* =====================================================================
   遊戲規則
   畫面座標用 256×144 的「遊戲單位」（canvas 實際就是這個大小，再用 CSS 放大成像素風）
   ===================================================================== */
const W = 256, H = 144, GROUND = 112, HERO_X = 62, PAL_X = 36, MON_X = 186;
const PER_FLOOR = 3;                                   // 每關 3 隻怪，最後一隻是頭目
const MONSTERS = [
  { type: "slime",    name: "劇透史萊姆" },
  { type: "bat",      name: "斷更蝙蝠" },
  { type: "mushroom", name: "爆雷蘑菇" },
  { type: "ghost",    name: "棄番幽靈" },
  { type: "golem",    name: "作畫崩壞魔像" },
];
let DB = null, QUESTIONS = [];
// 存檔：lv 等級、exp 經驗值、floor 目前第幾關、best 最多通過幾關、seen 看過的題目、
//       items 道具數量、perks 天賦、eps 點亮的集數（集數足跡）、lastQuote 上次過關的語錄、combo 最高連擊
let SAVE = { lv: 1, exp: 0, floor: 1, best: 0, seen: {}, items: {}, perks: {}, eps: {}, lastQuote: -1, stat: {}, combo: 0 };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
["seen", "items", "perks", "eps", "stat"].forEach(k => { if (!SAVE[k] || typeof SAVE[k] !== "object") SAVE[k] = {}; });
["lv", "floor"].forEach(k => { SAVE[k] = Math.max(1, Math.floor(+SAVE[k]) || 1); });
["exp", "best", "combo"].forEach(k => { SAVE[k] = Math.max(0, Math.floor(+SAVE[k]) || 0); });
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(SAVE)); } catch (e) {} }
// 遊戲事件（給畫面特效用）：spawn、ask、answer、levelup、down、floor、update、drawStart／drawBg／drawFx／drawEnd
const HOOK = { list: [], on(f){ this.list.push(f); }, emit(ev, a){ for (const f of this.list){ try { f(ev, a); } catch (e) { console.error(e); } } } };

/* =====================================================================
   音效：全部用瀏覽器內建的 Web Audio 即時合成（像紅白機的方波、雜訊），不需要音檔
   右上角「音效」按鈕可以開關，設定會記在瀏覽器裡
   ===================================================================== */
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null;
  const on = () => SAVE.sound !== false;
  function ctx(){
    if (!ac){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
      try { ac = new A(); master = ac.createGain(); master.gain.value = .22; master.connect(ac.destination); } catch (e) { ac = null; return null; } }
    if (ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  }
  // 瀏覽器規定要使用者先點過畫面才能出聲：第一次點擊／按鍵時把音效準備好
  const unlock = () => { if (on()) ctx(); };
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, unlock, { capture: true, passive: true }));

  // 一個音：freq 頻率、dur 長度（秒）、type 波形、to 滑到的頻率、at 延遲、vol 音量
  function tone(freq, dur, o = {}){
    const c = on() && ctx(); if (!c) return;
    const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), gn = c.createGain();
    osc.type = o.type || "square"; osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const v = o.vol != null ? o.vol : .5;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + .008); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gn); gn.connect(master); osc.start(t); osc.stop(t + dur + .02);
  }
  // 雜訊（打擊、爆炸、咀嚼聲）
  function noise(dur, o = {}){
    const c = on() && ctx(); if (!c) return;
    if (!noiseBuf){ noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + (o.at || 0), src = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
    src.buffer = noiseBuf; f.type = o.filter || "lowpass"; f.frequency.setValueAtTime(o.freq || 2000, t);
    if (o.toFreq) f.frequency.exponentialRampToValueAtTime(o.toFreq, t + dur);
    const v = o.vol != null ? o.vol : .5;
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(gn); gn.connect(master); src.start(t); src.stop(t + dur + .02);
  }
  // 一串音符：notes＝[[頻率, 長度], ...]
  function seq(notes, o = {}){ let at = o.at || 0; notes.forEach(([f, d]) => { if (f) tone(f, d * .95, { ...o, at }); at += d; }); }
  const N = { C4: 262, D4: 294, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, A5: 880, B5: 988, C6: 1047, E6: 1319, G6: 1568 };

  return {
    on, ctx, toggle(){ SAVE.sound = !on(); persist(); if (on()){ ctx(); this.blip(); } },
    blip(){ tone(880, .05, { vol: .25 }); },
    start(){ seq([[N.C5, .08], [N.E5, .08], [N.G5, .08], [N.C6, .16]], { vol: .35 }); },
    monster(boss){ if (boss){ seq([[110, .18], [104, .18], [98, .36]], { type: "sawtooth", vol: .35 }); noise(.5, { freq: 300, vol: .3, at: .1 }); }
      else seq([[196, .07], [147, .1]], { type: "triangle", vol: .5 }); },
    ask(){ tone(1320, .05, { vol: .18 }); tone(1760, .07, { vol: .18, at: .05 }); },
    hit(combo){ noise(.09, { freq: 4000, toFreq: 800, vol: .45 }); const b = 440 * Math.pow(2, Math.min(combo - 1, 8) / 12); tone(b, .1, { to: b * 2, vol: .3, at: .02 }); },
    crit(combo){ noise(.18, { freq: 6000, toFreq: 400, vol: .6 }); tone(220, .2, { to: 880, type: "sawtooth", vol: .3 }); const b = 660 * Math.pow(2, Math.min(combo - 1, 8) / 12); seq([[b, .06], [b * 1.5, .06], [b * 2, .12]], { vol: .25, at: .08 }); },
    defeat(){ noise(.35, { freq: 1500, toFreq: 120, vol: .5, at: .12 }); tone(330, .3, { to: 60, type: "triangle", vol: .4, at: .12 }); },
    hurt(){ noise(.2, { freq: 900, toFreq: 150, vol: .55 }); tone(220, .25, { to: 70, type: "sawtooth", vol: .35 }); },
    guard(){ tone(1568, .25, { type: "triangle", vol: .35 }); tone(2093, .3, { type: "triangle", vol: .25, at: .04 }); noise(.05, { freq: 8000, filter: "highpass", vol: .25 }); },
    down(){ seq([[N.G4, .18], [N.E4, .18], [N.C4, .18], [131, .5]], { type: "triangle", vol: .45, at: .35 }); },
    levelup(){ seq([[N.C5, .07], [N.E5, .07], [N.G5, .07], [N.C6, .07], [N.G5, .07], [N.C6, .22]], { vol: .3, at: .4 }); },
    chest(){ tone(150, .08, { type: "triangle", vol: .4, at: .55 }); seq([[N.E6, .05], [N.G6, .05], [N.E6, .05], [N.G6, .05], [2093, .18]], { type: "triangle", vol: .22, at: .65 }); },
    sparkle(at = 0){ seq([[N.A5, .05], [N.C6, .05], [N.E6, .1]], { type: "triangle", vol: .22, at }); },
    bento(){ for (let k = 0; k < 3; k++) noise(.06, { freq: 1200, vol: .35, at: k * .11 }); seq([[N.C5, .08], [N.G5, .14]], { type: "triangle", vol: .3, at: .36 }); },
    cut(){ noise(.12, { freq: 7000, filter: "highpass", vol: .4 }); noise(.12, { freq: 7000, filter: "highpass", vol: .4, at: .13 }); },
    askHost(){ tone(N.E5, .12, { type: "triangle", vol: .35 }); tone(N.C5, .2, { type: "triangle", vol: .35, at: .13 }); },
    charm(){ seq([[N.C6, .06], [N.E6, .06], [N.G6, .06], [2093, .2]], { type: "triangle", vol: .22 }); },
    perk(){ seq([[N.G5, .07], [N.C6, .18]], { vol: .28 }); },
    clear(){ seq([[N.C5, .1], [N.C5, .1], [N.C5, .1], [N.C5, .25], [N.G4, .25], [N.A4, .25], [N.C5, .15], [0, .05], [N.A4, .1], [N.C5, .45]], { vol: .3 });
      seq([[N.E4, .3], [N.E4, .25], [N.D4, .25], [N.E4, .25], [N.F4, .2], [N.E4, .5]], { type: "triangle", vol: .3, at: .3 }); },
  };
})();

/* =====================================================================
   背景音樂：原創的 8-bit 小曲，同樣用 Web Audio 即時合成（不需要音檔）
   - 冒險曲：一般前進、答題時（C 大調、輕快）
   - 頭目曲：頭目出現時（A 小調、比較緊張）
   過關、倒下時會先停下來讓勝利／失敗音效播完，下一關開始再接著放。
   右上角「音樂：開／關」可以切換，跟音效分開設定。
   ===================================================================== */
const MUSIC = (() => {
  const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
    return 440 * Math.pow(2, (k + (+m[3] + 1) * 12 - 69) / 12); };
  // 寫譜的方式："音名:長度" 用空白隔開，長度單位是十六分音符（2＝八分音符、4＝四分音符），"-" 是休止
  function parse(str){ const out = []; str.trim().split(/\s+/).forEach(tok => { const [n, l] = tok.split(":"); out.push([n === "-" ? 0 : NOTE(n), +l]); }); return out; }
  function toSteps(list, total){ const arr = new Array(total).fill(null); let p = 0; list.forEach(([f, l]) => { if (f) arr[p % total] = [f, l]; p += l; }); return arr; }
  function bassLine(chords, pattern){ const out = []; chords.forEach(ch => pattern.forEach(([o, l]) => out.push([o === null ? 0 : NOTE(ch + (2 + o)), l]))); return out; }

      chords: ["C", "A", "F", "G", "C", "A", "F", "C"], bass: [[0, 2], [1, 2], [0, 2], [1, 2], [0, 2], [1, 2], [0, 2], [1, 2]],
      drum: s => ({ kick: s % 8 === 0, snare: s % 8 === 4, hat: s % 2 === 0 }) },

      chords: ["A", "A", "F", "E"], bass: [[0, 2], [0, 2], [1, 2], [0, 2], [0, 2], [0, 2], [1, 2], [0, 2]],
      drum: s => ({ kick: s % 4 === 0, snare: s % 8 === 4, hat: true }) },
    // ----- 以下是之後加的曲子 -----
    title: { name: "標題曲", bpm: 96, bars: 8,                       // F 大調、慢慢的開場
      lead: "A4:4 C5:4 F5:6 E5:2  G5:4 E5:4 C5:8  D5:4 F5:4 A5:6 G5:2  F5:4 D5:4 A#4:8 " +
            "A4:4 C5:4 F5:4 A5:4  G5:6 F5:2 E5:4 C5:4  D5:4 F5:4 A#5:4 A5:4  G5:12 -:4",
      chords: ["F", "C", "D", "A#", "F", "C", "A#", "C"], bass: [[0, 8], [1, 8]],
      drum: s => ({ kick: s % 16 === 0, snare: false, hat: s % 4 === 2 }) },
    festival: { name: "廟會曲", bpm: 144, bars: 8,                   // G 大調五聲音階、熱鬧（夜市、廟口、祭典）
      lead: "G5:2 E5:2 D5:2 E5:2 G5:4 A5:4  B5:2 A5:2 G5:2 E5:2 D5:8  E5:2 G5:2 A5:2 G5:2 E5:4 D5:4  B4:2 D5:2 E5:2 G5:2 A5:8 " +

      chords: ["E", "E", "A", "E", "A", "A", "F", "E"], bass: [[0, 8], [1, 8]],

      chords: ["D", "C", "D", "C", "A#", "C", "D", "A"], bass: [[0, 2], [0, 2], [1, 2], [0, 2], [0, 2], [0, 2], [1, 2], [0, 2]],

      drum: s => ({ kick: s % 8 === 0, snare: s % 16 === 12, hat: false }) },
    final: { name: "魔王曲", bpm: 168, bars: 4,                     // E 小調、最緊張（魔王城頭目、之後每 10 關的頭目）
      lead: "E5:2 E5:2 F5:2 E5:2 B5:4 A5:2 G5:2  F5:2 G5:2 A5:2 G5:2 F5:4 E5:4  D5:2 F5:2 A5:2 D6:2 C6:2 A5:2 F5:4  D#5:4 F#5:4 B5:8",
      chords: ["E", "C", "D", "B"], bass: [[0, 2], [1, 2], [0, 2], [1, 2], [0, 2], [1, 2], [0, 2], [1, 2]],
      drum: s => ({ kick: s % 4 === 0, snare: s % 8 === 4, hat: true }) },
  };
  Object.entries(TRACKS).forEach(([k, t]) => { const total = t.bars * 16; t.total = total;
    const len = parse(t.lead).reduce((a, n) => a + n[1], 0); if (len !== total) console.error("曲子長度不對", k, len, total);
    t.leadSteps = toSteps(parse(t.lead), total); t.bassSteps = toSteps(bassLine(t.chords, t.bass), total); });

  let ac = null, out = null, timer = null, cur = null, want = null, step = 0, nextT = 0, pulse = null, noiseBuf = null, gestured = false;
  const on = () => SAVE.music !== false;
  function ready(){
    if (!gestured) return null;                                    // 還沒點過畫面：先記住要放哪首，第一次點擊時再開始
    ac = SFX.ctx(); if (!ac) return null;
    if (!out){ out = ac.createGain(); out.gain.value = .085; out.connect(ac.destination);
      // 25% 的方波（紅白機主旋律常用的音色）
      const n = 32, re = new Float32Array(n), im = new Float32Array(n); for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * .25);
      pulse = ac.createPeriodicWave(re, im);
      noiseBuf = ac.createBuffer(1, ac.sampleRate / 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.setValueAtTime(vol, t + Math.max(.02, dur - .04)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .02);
  }
  function drum(t, d){
    if (d.kick){ const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
      g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .14); o.connect(g); g.connect(out); o.start(t); o.stop(t + .16); }
    const hit = (len, freq, vol, type) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + len + .02); };
    if (d.snare) hit(.12, 1800, .5, "bandpass");
    if (d.hat) hit(.03, 7000, .18, "highpass");
  }
  function tick(){
    if (!ac || !cur) return;
    const tr = TRACKS[cur], dt = 60 / tr.bpm / 4;
    if (nextT < ac.currentTime - .5) nextT = ac.currentTime + .05;       // 分頁切回來時不要一次補一大串音符
    while (nextT < ac.currentTime + .15){
      const L = tr.leadSteps[step], B = tr.bassSteps[step];
      if (L) note(nextT, L[0], L[1] * dt * .92, tr.wave || "pulse", tr.wave === "triangle" ? .5 : tr.wave === "square" ? .22 : .32);
      if (B) note(nextT, B[0], B[1] * dt * .9, "triangle", .55);
      drum(nextT, tr.drum(step));
      nextT += dt; step = (step + 1) % tr.total;
    }
  }
  function start(name){
    if (!on() || document.hidden || !ready()) return;
    if (cur === name && timer) return;
    stopTimer(); cur = name; step = 0; nextT = ac.currentTime + .08; timer = setInterval(tick, 25); tick();
  }
  function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } cur = null; }
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopTimer(); else if (want) start(want); });
  const onGesture = () => { if (gestured) return; gestured = true; if (want) start(want); };
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, onGesture, { capture: true, passive: true }));
  return {
    on,
    play(name){ want = name; start(name); },
    stop(){ want = null; stopTimer(); },
    toggle(){ SAVE.music = !on(); persist(); if (on()){ if (want) start(want); } else stopTimer(); },
    now: () => cur,
    names: () => Object.keys(TRACKS),
  };
})();

  { id: "combo", name: "連擊達人",   desc: "連續答對 2 題就開始暴擊（原本要 3 題）", max: 1 },
  { id: "heal",  name: "大胃王",     desc: "便當回復量 +20%",            max: 3 },
  { id: "gcut",  name: "考古題",     desc: "立刻獲得 2 個刪去法",        max: 99, item: ["cut", 2] },
  { id: "gask",  name: "熱線電話",   desc: "立刻獲得 2 個問主持人",      max: 99, item: ["ask", 2] },
  { id: "gcharm", name: "平安符",    desc: "立刻獲得 1 個護身符",        max: 99, item: ["charm", 1] },
];
const perk = id => Math.max(0, Math.floor(+SAVE.perks[id]) || 0);

/* 難度數值（2026-11 用模擬調整過：答對率 50%／60%／70%／80%／90% 的玩家，大約分別卡在第 4／6／10／16／37 關） */
const BAL = { hp0: 30, hpLv: 4, hpPerk: 8, dmg0: 8, dmgF: 2, dmgF2: .03, monCap: 4, monStep: 3, bossBase: 3, bossStep: 5, bossCap: 5, drop: .3, dropPerk: .12, bossDrops: 1 };
const maxHp = () => BAL.hp0 + (SAVE.lv - 1) * BAL.hpLv + perk("hp") * BAL.hpPerk;
const needExp = () => 20 + SAVE.lv * 10;
const monDmg = () => Math.round(BAL.dmg0 + SAVE.floor * BAL.dmgF + SAVE.floor * SAVE.floor * BAL.dmgF2);
const critAt = () => 3 - Math.min(1, perk("combo"));                       // 連續答對幾題開始暴擊
const rankOf = n => { let t = { name: "", line: "" }; ((DB && DB.titles) || []).forEach(x => { if (n >= x.min) t = x; }); return t; };

/* ---------- 選題：沒看過的優先；前面幾關偏簡單，頭目偏難 ---------- */
function nextQuestion(boss){
  if (QUESTIONS.every(q => SAVE.seen[q.id])) SAVE.seen = {};
  let pool = QUESTIONS.filter(q => !SAVE.seen[q.id]);
  const prefs = boss ? [3, 2] : SAVE.floor <= 2 ? [1, 2] : [];
  for (const lv of prefs){ const sub = pool.filter(q => q.lv === lv); if (sub.length){ pool = sub; break; } }
  const q = pool[Math.floor(Math.random() * pool.length)];
  return { q, opts: shuffle(q.a.map((t, i) => ({ t, right: i === 0 }))), used: {} };
}
function spawn(){
  const boss = G.idx === PER_FLOOR - 1, f = SAVE.floor;
  const base = MONSTERS[(f - 1 + G.idx * 2) % MONSTERS.length];
  const hp = boss ? Math.min(BAL.bossCap, BAL.bossBase + Math.floor((f - 1) / BAL.bossStep)) : Math.min(BAL.monCap, 1 + Math.floor((f - 1) / BAL.monStep));
  G.mon = { ...base, boss, name: boss ? "頭目・" + base.name : base.name, hp, max: hp, x: W + 30, hurt: 0, dead: 0 };
  G.phase = "approach"; SFX.monster(boss); HOOK.emit("spawn", { boss }); if (boss) MUSIC.play(bossBgmFor(SAVE.floor));
}
function float(text, x, y, color){ G.fx.push({ text, x, y, t: 0, color }); }
function say(html){ $("#dlg").innerHTML = html; renderItems(); }
function focusMsg(){ const el = $("#dlg .msg") || $("#dlg .q"); if (el){ el.tabIndex = -1; el.focus({ preventScroll: true }); } }
// 手機螢幕比較矮：出題時把整個題目捲進畫面，答完把「繼續」捲進畫面
function reveal(el){ try { el.scrollIntoView({ block: "nearest", behavior: RMOTION ? "auto" : "smooth" }); } catch (e) {} }
function hud(){
  $("#h-lv").textContent = SAVE.lv; $("#h-floor").textContent = `第 ${SAVE.floor} 關`;
  $("#h-hp").style.width = (G.hp / maxHp() * 100) + "%"; $("#h-hpn").textContent = `${G.hp}/${maxHp()}`;
  $("#h-xp").style.width = (SAVE.exp / needExp() * 100) + "%"; $("#h-xpn").textContent = `${SAVE.exp}/${needExp()}`;
  renderItems(); renderFoot();
}

/* ---------- 道具列 ---------- */
function canUse(id){
  const c = G.cur, asking = G.phase === "ask" && c && c.picked == null;
  if (!itemN(id)) return false;
  if (id === "bento") return G.hp > 0 && G.hp < maxHp() && G.phase !== "title" && G.phase !== "dead" && G.phase !== "perk";
  if (!asking || c.used[id]) return false;
  if (id === "cut") return !c.used.ask;                                    // 先問了主持人就不能再刪去（避免剛好刪掉提示）
  return true;
}
function renderItems(){
  const box = $("#items"); if (!box) return;
  box.innerHTML = ITEMS.map(it => `<button class="item" type="button" data-it="${it.id}" ${canUse(it.id) ? "" : "disabled"} title="${it.name}：${it.desc}" aria-label="${it.name}（剩 ${itemN(it.id)} 個）：${it.desc}">
    <img src="${ICON[it.id]}" alt=""><span>${it.name}</span><b>${itemN(it.id)}</b></button>`).join("");
}
function useItem(id){
  if (!canUse(id)) return;
  const c = G.cur;
  SAVE.items[id] = itemN(id) - 1;
  if (id === "bento"){
    const heal = Math.round(maxHp() * .4 * (1 + perk("heal") * .2)); G.hp = Math.min(maxHp(), G.hp + heal);
    SFX.bento(); float("+" + heal + " HP", HERO_X, GROUND - 44, "#63c74d"); note(`吃了便當，回復 ${heal} 點血量。`);
  } else if (id === "cut"){
    c.used.cut = 1; SFX.cut();
    const wrongs = shuffle(c.opts.map((o, k) => o.right ? -1 : k).filter(k => k >= 0)).slice(0, 2);
    wrongs.forEach(k => { c.opts[k].gone = 1; const b = document.querySelector(`.opt[data-i="${k}"]`); if (b){ b.disabled = true; b.classList.add("gone"); b.setAttribute("aria-label", c.opts[k].t + "（已刪去）"); } });
    note("刪去法：拿掉了兩個錯的選項。");
  } else if (id === "ask"){
    c.used.ask = 1; SFX.askHost();
    const live = c.opts.map((o, k) => k).filter(k => !c.opts[k].gone), right = c.opts.findIndex(o => o.right);
    const sure = Math.random() < .8, pickK = sure ? right : shuffle(live.filter(k => k !== right))[0];
    const host = Math.random() < .5 ? { n: "二百五", img: "img/host-250.webp" } : { n: "鳳梨索", img: "img/host-pineapple.webp" };
    const lines = ["我記得好像是", "這題我有印象，應該是", "嗯……我猜是", "錄的時候好像講過，是"];
    const box = document.createElement("div"); box.className = "hint";
    box.innerHTML = `<img src="${host.img}" alt=""><p><b>${host.n}：</b>${lines[Math.floor(Math.random() * lines.length)]}「${"ABCD"[pickK]}」吧？<small>（主持人也可能記錯喔）</small></p>`;
    const opts = $("#dlg .opts"); if (opts) opts.after(box);
  } else if (id === "charm"){
    c.used.charm = 1; SFX.charm(); note("護身符發動：這一題答錯也不會被打。");
  }
  persist(); hud();
}
function note(text){ const n = $("#note"); if (!n) return; n.textContent = text; n.hidden = false; clearTimeout(note.t); note.t = setTimeout(() => { n.hidden = true; }, 2600); }

/* ---------- 集數足跡 ---------- */
function footStats(){
  const all = (DB && DB.all_eps) || [], have = new Set(QUESTIONS.map(q => q.ep));
  const lit = all.filter(e => SAVE.eps[e[0]]).length;
  return { all, have, lit, total: all.filter(e => have.has(e[0])).length };
}
function renderFoot(){ const b = $("#foot-btn"); if (!b || !DB) return; const s = footStats(); $("#foot-n").textContent = `${s.lit}/${s.total}`; }
function openFoot(){
  SFX.blip();
  const s = footStats(), dlg = $("#foot");
  $("#foot-sum").innerHTML = `答對某一集的題目，就會點亮那一集。你已經走過 <b>${s.lit}</b>／${s.total} 集` + (s.all.length > s.total ? `<small>（全部 ${s.all.length} 集裡，有 ${s.total} 集已經有題目）</small>` : "");
  $("#foot-grid").innerHTML = s.all.map(([id, label, title]) => {
    const st = SAVE.eps[id] ? "lit" : s.have.has(id) ? "" : "none";
    return `<button type="button" class="ep ${st}" data-ep="${id}" aria-label="${esc(title)}（${st === "lit" ? "已點亮" : st === "none" ? "還沒有題目" : "還沒點亮"}）">${esc(label)}</button>`;
  }).join("");
  $("#foot-info").innerHTML = "點一個集數看標題，可以直接去搜尋站聽那一集。";
  dlg.hidden = false; document.body.style.overflow = "hidden"; $("#foot-x").focus();
}
function closeFoot(){ $("#foot").hidden = true; document.body.style.overflow = ""; $("#foot-btn").focus({ preventScroll: true }); }

/* ---------- 標題畫面 ---------- */
function title(){
  MUSIC.play("title");
  G.phase = "title"; G.mon = null; G.cur = null; G.hp = maxHp(); G.down = 0; G.combo = 0; hud();
  const has = SAVE.floor > 1 || SAVE.lv > 1 || SAVE.exp > 0, r = rankOf(SAVE.best);
  say(`<h2 class="msg">二百五和鳳梨索的冒險，需要你的節目知識！</h2>
    <p class="sub">隊伍會自動前進，遇到怪物就出題。<b>答對</b>就攻擊，<b>答錯</b>會被打；連續答對會<b>暴擊</b>。打倒怪物拿經驗值，有機會掉<b>寶箱</b>，升級時可以選一個<b>天賦</b>。血歸零要重打這一關，等級和道具都還在。</p>
    <p class="sub">題庫 <b>${QUESTIONS.length}</b> 題，來自 <b>${DB.episodes}</b> 集${SAVE.best ? `　｜　你最多通過 <b>${SAVE.best}</b> 關　<span class="rank">${esc(r.name)}</span>` : ""}</p>
    <div class="go left"><button class="btn" id="go" type="button">${has ? `繼續冒險（第 ${SAVE.floor} 關・LV ${SAVE.lv}）` : "開始冒險"}</button>
    ${SAVE.best ? `<button class="btn alt" id="sh" type="button">分享成績圖</button>` : ""}
    ${has ? `<button class="link" id="reset" type="button">從第 1 關重新開始</button>` : ""}</div>`);
  $("#go").onclick = startFloor; if ($("#sh")) $("#sh").onclick = () => openCard("best", SAVE.best);
  if ($("#reset")) $("#reset").onclick = () => {
    say(`<h2 class="msg">確定要重新開始嗎？</h2><p class="sub">等級、天賦、道具會重來，從第 1 關開始。最多通過 ${SAVE.best} 關的紀錄和集數足跡會保留。</p>
      <div class="go left"><button class="btn" id="go" type="button">重新開始</button><button class="btn alt" id="back" type="button">取消</button></div>`);
    $("#go").onclick = () => { SAVE.lv = 1; SAVE.exp = 0; SAVE.floor = 1; SAVE.items = {}; SAVE.perks = {}; persist(); startFloor(); };
    $("#back").onclick = title; focusMsg();
  };
}
function startFloor(){
  SFX.start(); MUSIC.play(bgmFor(SAVE.floor));
  G.idx = 0; G.mon = null; G.cur = null; G.hp = maxHp(); G.down = 0; G.fx = []; G.combo = 0; G.chest = null; G.phase = "walk"; G.t = 0; persist(); hud();
  HOOK.emit("floor", { f: SAVE.floor });
  say(`<h2 class="msg">第 ${SAVE.floor} 關・${sceneFor(SAVE.floor).name}，出發！</h2><p class="sub">這一關有 ${PER_FLOOR} 隻怪物，最後一隻是頭目。</p>`); focusMsg();
}

/* ---------- 出題、作答 ---------- */
function ask(){
  G.cur = nextQuestion(G.mon.boss); G.phase = "ask";
  const c = G.cur;
  say(`<p class="who"><b>${esc(G.mon.name)}</b> 出題！　出自 ${esc(c.q.et)}</p><h2 class="q" tabindex="-1">${esc(c.q.q)}</h2>
    <div class="opts">${c.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`);
  focusMsg(); reveal($("#dlg")); SFX.ask(); HOOK.emit("ask");
}
function answer(i){
  const cur = G.cur; if (!cur || cur.picked != null || G.phase !== "ask" || cur.opts[i].gone) return;
  cur.picked = i; G.phase = "answered";
  const ok = cur.opts[i].right, m = G.mon, q = cur.q, extra = [];
  SAVE.seen[q.id] = 1;
  // 匿名統計答錯率：每位玩家每題只記第一次作答，用了刪去法或問主持人的不算（只送「題目代號＋對或錯」，不記是誰）
  if (!SAVE.stat[q.id]){ SAVE.stat[q.id] = 1; if (!cur.used.cut && !cur.used.ask) countAnswer(q, ok); }
  if (ok){
    G.combo++; G.comboT = 1.2; if (G.combo > SAVE.combo) SAVE.combo = G.combo;
    const crit = G.combo >= critAt(), dmg = crit ? 2 : 1;
    G.heroLunge = 1; m.hurt = 1; m.hp = Math.max(0, m.hp - dmg); float((crit ? "CRIT -" : "-") + dmg, m.x, GROUND - 40, crit ? "#ff7b1c" : "#ffe45c"); G.hit = { x: m.x - 8, y: GROUND - 20, t: 0, big: crit };
    if (crit) SFX.crit(G.combo); else SFX.hit(G.combo);
    HOOK.emit("answer", { ok: true, crit, combo: G.combo, killed: m.hp <= 0 });
    if (crit) extra.push(`<b class="crit">${G.combo} 連擊・暴擊！</b>造成 2 點傷害。`);
    else if (G.combo > 1) extra.push(`${G.combo} 連擊！再答對 ${critAt() - G.combo} 題就會暴擊。`);
    if (!SAVE.eps[q.ep]){ SAVE.eps[q.ep] = 1; SFX.sparkle(.25); extra.push(`<b class="new">點亮新集數！</b>集數足跡 ${footStats().lit}/${footStats().total}`); }
    if (m.hp <= 0){
      m.dead = 0.001; SFX.defeat();
      const bonus = 1 + Math.min(G.combo, 10) * .05 + perk("exp") * .15;
      const gain = Math.round(((m.boss ? 20 : 10) + q.lv * 2) * bonus); SAVE.exp += gain; float("+" + gain + " EXP", HERO_X, GROUND - 48, "#fee761");
      while (SAVE.exp >= needExp()){ SAVE.exp -= needExp(); SAVE.lv++; G.hp = maxHp(); G.levelUp = 1.6; G.pendingPerks++; SFX.levelup(); HOOK.emit("levelup"); float("LEVEL UP!", HERO_X + 14, GROUND - 62, "#63c74d"); }
      // 寶箱：頭目必掉道具；一般怪物有機率掉 1 個
      const drops = m.boss ? BAL.bossDrops : (Math.random() < BAL.drop + perk("drop") * BAL.dropPerk ? 1 : 0);
      if (drops){ const got = []; for (let k = 0; k < drops; k++){ const id = rollItem(); giveItem(id, 1); got.push(ITEMS.find(x => x.id === id).name); }
        G.chest = { x: m.x, t: 0 }; SFX.chest(); extra.push(`<b class="new">寶箱！</b>獲得 ${got.join("、")}。`); }
    }
  } else {
    const lost = G.combo; G.combo = 0;
    G.monLunge = 1;
    if (cur.used.charm){ SFX.guard(); float("GUARD", HERO_X, GROUND - 44, "#8ccbe6"); G.hit = { x: HERO_X + 8, y: GROUND - 20, t: 0 }; extra.push("護身符擋下了攻擊！"); }
    else { SFX.hurt(); G.heroHurt = 1; const d = monDmg(); G.hp = Math.max(0, G.hp - d); float("-" + d, HERO_X, GROUND - 44, "#ffffff"); G.hit = { x: HERO_X + 8, y: GROUND - 20, t: 0 }; if (G.hp <= 0){ G.down = 0.001; MUSIC.stop(); HOOK.emit("down"); SFX.down(); } }
    if (lost > 1) extra.push(`${lost} 連擊中斷了。`);
    HOOK.emit("answer", { ok: false, guard: !!cur.used.charm, lost });
  }
  persist(); hud();
  document.querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true; const o = cur.opts[k];
    if (o.right){ b.classList.add("right"); b.setAttribute("aria-label", o.t + "（正確答案）"); }
    else if (k === i){ b.classList.add("wrong"); b.setAttribute("aria-label", o.t + "（你選的，答錯）"); }
    else if (!o.gone) b.classList.add("dim");
  });
  const url = "https://spiritboyaway.github.io/podcast-search/?ep=" + encodeURIComponent(q.ep) + (q.t != null ? "&t=" + q.t : "");
  const verdict = ok ? (m.hp <= 0 ? `答對，打倒${m.boss ? "頭目" : "怪物"}了！` : "答對，攻擊成功！") : "答錯，被反擊了！";
  const d = document.createElement("div");
  d.innerHTML = `<p class="fb"><b class="${ok ? "ok" : "no"}">${verdict}</b>　${esc(q.x || "")}　<a href="${url}" target="_blank" rel="noopener">▶ 聽節目怎麼說</a></p>
    ${extra.length ? `<p class="extra">${extra.join("　")}</p>` : ""}
    <div class="go"><button class="btn" id="go" type="button">${G.pendingPerks ? "升級！選天賦 →" : "繼續 →"}</button></div>`;
  $("#dlg").append(...d.childNodes);
  $("#go").onclick = proceed; $("#go").focus({ preventScroll: true }); reveal($("#go").parentNode);
}
function choosePerk(){
  G.phase = "perk";
  const pool = shuffle(PERKS.filter(p => perk(p.id) < p.max)).slice(0, 3);
  say(`<h2 class="msg">升到 LV ${SAVE.lv - G.pendingPerks + 1}！選一個天賦</h2><p class="sub">血量已經補滿。天賦會一直保留，直到從第 1 關重新開始。</p>
    <div class="perks">${pool.map(p => `<button class="perk" type="button" data-p="${p.id}"><b>${p.name}</b><span>${p.desc}</span>${perk(p.id) && !p.item ? `<small>目前 ${perk(p.id)} 級</small>` : ""}</button>`).join("")}</div>`);
  document.querySelectorAll(".perk").forEach(b => b.onclick = () => {
    const p = PERKS.find(x => x.id === b.dataset.p);
    SAVE.perks[p.id] = perk(p.id) + 1; if (p.item) giveItem(p.item[0], p.item[1]);
    if (p.id === "hp") G.hp = Math.min(maxHp(), G.hp + 8);
    G.pendingPerks--; SFX.perk(); persist(); hud(); proceed();
  });
  focusMsg(); reveal($("#dlg"));
}
function pickQuote(){
  const qs = (DB && DB.quotes) || []; if (!qs.length) return null;
  let k = Math.floor(Math.random() * qs.length); if (qs.length > 1 && k === SAVE.lastQuote) k = (k + 1) % qs.length;
  SAVE.lastQuote = k; return qs[k];
}
function proceed(){
  if (G.pendingPerks > 0) return choosePerk();
  const m = G.mon;
  if (G.hp <= 0){
    G.phase = "dead"; MUSIC.stop();
    say(`<h2 class="msg">隊伍倒下了……</h2><p class="sub">沒關係，等級、天賦和道具都還在。補滿血，重打第 ${SAVE.floor} 關吧！</p>
      <div class="go"><button class="btn alt" id="sh" type="button">分享紀錄</button><button class="btn" id="go" type="button">重打這一關</button></div><p class="said" id="said"></p>`);
    $("#go").onclick = startFloor; $("#sh").onclick = () => openCard("dead", SAVE.floor); $("#go").focus({ preventScroll: true }); return;
  }
  if (m && m.hp <= 0){
    G.mon = null; G.idx++;
    if (G.idx >= PER_FLOOR){
      const done = SAVE.floor, newBest = done > SAVE.best, before = rankOf(SAVE.best).name;
      SAVE.best = Math.max(SAVE.best, done); SAVE.floor = done + 1; G.phase = "clear"; G.clearT = 0; MUSIC.stop(); SFX.clear(); HOOK.emit("clear");
      const r = rankOf(SAVE.best), qt = pickQuote(); persist();
      const quoteHtml = qt ? `<figure class="quote"><img src="${qt.w === "二百五" ? "img/host-250.webp" : "img/host-pineapple.webp"}" alt=""><blockquote><p>「${esc(qt.q)}」</p>
        <footer>—— ${esc(qt.w)}・${esc(qt.et)}　<a href="https://spiritboyaway.github.io/podcast-search/?ep=${encodeURIComponent(qt.ep)}&t=${qt.t}" target="_blank" rel="noopener">▶ 聽這一段</a></footer></blockquote></figure>` : "";
      say(`<h2 class="msg">第 ${done} 關過關！</h2>
        ${quoteHtml}
        <p class="sub">目前 <b>LV ${SAVE.lv}</b>${newBest ? "，刷新個人紀錄！" : `，個人紀錄是通過 ${SAVE.best} 關。`}　稱號：<span class="rank">${esc(r.name)}</span>${newBest && r.name !== before ? "　← 新稱號！" : ""}</p>
        <div class="go"><button class="btn alt" id="sh" type="button">分享紀錄</button><button class="btn" id="go" type="button">前往第 ${SAVE.floor} 關 →</button></div><p class="said" id="said"></p>`);
      $("#go").onclick = startFloor; $("#sh").onclick = () => openCard("clear", done); hud(); $("#go").focus({ preventScroll: true }); return;
    }
    G.phase = "walk"; G.t = 0; G.cur = null;
    say(`<h2 class="msg">繼續前進……</h2><p class="sub">${G.idx === PER_FLOOR - 1 ? "前面有很強的氣息，頭目要來了！" : `這一關還有 ${PER_FLOOR - G.idx} 隻怪物。`}${G.combo > 1 ? `　目前 ${G.combo} 連擊中。` : ""}</p>`); return;
  }
  ask();
}
$("#dlg").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) answer(+b.dataset.i); });

/* ---------- 每一格畫面更新 ---------- */
function update(dt){
  HOOK.emit("update", dt);
  G.t += dt;
  G.moving = G.phase === "walk" || G.phase === "approach" || G.phase === "title";
  if (G.moving) G.scroll += 46 * dt;
  if (G.phase === "walk" && G.t > 1.3) spawn();
  if (G.phase === "approach"){ G.mon.x -= 46 * dt * 1.5; if (G.mon.x <= MON_X){ G.mon.x = MON_X; ask(); } }
  ["heroLunge", "monLunge"].forEach(k => { if (G[k] > 0) G[k] = Math.max(0, G[k] - dt * 2.6); });
  if (G.heroHurt > 0) G.heroHurt = Math.max(0, G.heroHurt - dt * 2.2);
  if (G.levelUp > 0) G.levelUp = Math.max(0, G.levelUp - dt);
  if (G.down) G.down = Math.min(1, G.down + dt * 2);
  if (G.phase === "clear") G.clearT += dt;
  if (G.mon){ if (G.mon.hurt > 0) G.mon.hurt = Math.max(0, G.mon.hurt - dt * 2.2); if (G.mon.dead) G.mon.dead = Math.min(1, G.mon.dead + dt * 1.8); }
  if (G.hit){ G.hit.t += dt; if (G.hit.t > 0.45) G.hit = null; }
  if (G.chest){ G.chest.t += dt; if (G.chest.t > 2.4) G.chest = null; }
  if (G.comboT > 0) G.comboT = Math.max(0, G.comboT - dt * 3);
  G.fx.forEach(f => f.t += dt); G.fx = G.fx.filter(f => f.t < 1.1);
}

/* ---------- 畫圖小工具 ---------- */
const hsl = (h, s, l) => `hsl(${((Math.round(h) % 360) + 360) % 360},${s}%,${l}%)`;
function circ(cx, cy, r, c){ for (let dy = -r; dy <= r; dy++){ const w = Math.floor(Math.sqrt(r * r - dy * dy)); R(c, cx - w, cy + dy, 2 * w + 1, 1); } }
function tri(x, y, w, h, c){ for (let k = 0; k < h; k++){ const ww = Math.max(1, Math.round(w * (k + 1) / h)); R(c, x + (w - ww) / 2, y + k, ww, 1); } }      // 尖端朝上
function vtri(x, y, w, h, c){ for (let k = 0; k < h; k++){ const ww = Math.max(1, Math.round(w * (1 - k / h))); R(c, x + (w - ww) / 2, y + k, ww, 1); } }    // 尖端朝下
// 飄落／飄起的粒子：雪、雨、花瓣、螢火蟲、火星、泡泡
function parts(n, paint, o){
  const tm = now(), par = o.par != null ? o.par : .9, vyB = o.vy != null ? o.vy : 12, vxB = o.vx || 0;
  for (let k = 0; k < n; k++){
    const vy = vyB * (.6 + rnd(k * 3.1) * .8), vx = vxB * (.6 + rnd(k * 5.7) * .8);
    const px = (((k * 53 + tm * vx - G.scroll * par) % W) + W) % W;
    const py = (((rnd(k) * (H + 10) + tm * vy) % (H + 10)) + H + 10) % (H + 10) - 5;
    paint(px, py, k, tm);
  }
}

/* ---------- 關卡順序：前 22 關是手工畫的背景，一關一種、不重複，像一趟從錄音室出發、越走越遠的冒險 ---------- */
const HAND = ["studio", "street", "oldstreet", "nightmarket", "temple", "mrt", "ricefield", "school", "rooftop", "shrine", "festival",
              "summer", "onsen", "snowtown", "forest", "desert", "volcano", "underwater", "icecave", "skycity", "dungeon", "demoncastle"];

/* ---------- 第 23 關以後：程式自動組出新場景 ----------
   遠景 5 種 × 中景 7 種 × 地面 6 種 × 天氣 6 種 × 時段 3 種＝3780 種組合，每一關取不同的組合（不會重複），
   配色也依關數變化。名字也是自動組的，例如「浮島雪原的水晶谷（深夜・飄雪）」，同樣每一關都不同。 */
const GEN = { FAR: ["群山", "尖塔", "浮島", "台地", "廢都"], MID: ["樹林", "針葉林", "巨菇森林", "水晶谷", "遺跡", "亂石原", "小村"],
  GROUND: ["草原", "石板路", "沙丘", "雪原", "木棧道", "苔磚路"],
  WEATHER: ["", "飄雪", "下雨", "落花", "螢火蟲", "火星飛散"], TIME: ["晴空", "黃昏", "深夜"], cache: {} };
function genScene(f){
  if (GEN.cache[f]) return GEN.cache[f];
  const N = 5 * 7 * 6 * 6 * 3, k = f - HAND.length - 1;
  let idx = ((k * 1531 + 7) % N + N) % N;                              // 1531 跟 3780 互質 → 前 3780 個生成關卡的組合都不同
  const far = idx % 5; idx = Math.floor(idx / 5); const mid = idx % 7; idx = Math.floor(idx / 7);
  const gr = idx % 6; idx = Math.floor(idx / 6); const wx = idx % 6; idx = Math.floor(idx / 6); const tod = idx % 3;
  const h = [165 + rnd(f * 13.7) * 120, 260 + rnd(f * 13.7) * 130, 200 + rnd(f * 13.7) * 100][tod], h2 = h + 90 + Math.floor(rnd(f * 7.3) * 180), h3 = h + Math.floor(rnd(f * 3.1) * 360);
  const L = (d, du, n) => [d, du, n][tod];
  const sky = [0, 1, 2, 3, 4, 5].map(n => tod === 0 ? hsl(h, 55, 50 + n * 7) : tod === 1 ? hsl(h + n * 12, 50 + n * 6, 20 + n * 10) : hsl(h, 45, 6 + n * 3));
  const fc = hsl(h2, 25, L(68, 34, 16)), fc2 = hsl(h2, 25, L(60, 28, 12));
  const mc = hsl(h3, 40, L(38, 24, 12)), mc2 = hsl(h3, 45, L(50, 34, 20)), acc = hsl(h3 + 180, 75, L(62, 60, 58)), win = hsl(h + 40, 85, 72);
  const gc = gr === 3 ? hsl(h2, 30, 92) : hsl(h2 + 30, 35, L(46, 32, 20)), gc2 = gr === 3 ? hsl(h2, 30, 82) : hsl(h2 + 30, 35, L(36, 24, 14)), gtop = gr === 0 ? hsl(110 + (h % 60), 45, L(48, 34, 22)) : gc2;
  const name = `未知領域：${GEN.FAR[far]}${GEN.GROUND[gr]}的${GEN.MID[mid]}（${GEN.TIME[tod]}${wx ? "・" + GEN.WEATHER[wx] : ""}）`;
  const sc = { name, draw(){
    const tm = now();
    bands(sky);
    if (tod === 0){ circ(205, 24, 9, "#fff6c4"); layer(.04, 130, (x, i) => { const y = 14 + Math.floor(rnd(i + f) * 20); R("#ffffff", x + 10, y, 34, 6); R("#ffffff", x + 18, y - 4, 18, 4); }); }
    else if (tod === 1) circ(200, 62, 12, hsl(h + 50, 90, 72));
    else { for (let i = 0; i < 20; i++) R("#ffffff", (i * 53 + f * 7) % W, (i * 29 + f) % 60, 1, 1); circ(200, 24, 7, "#f1f1e6"); circ(203, 22, 6, sky[0]); }
    // 遠景
    if (far === 0) layer(.06, 8, (x, i) => { const hh = hill(i * 1.3 + f) + 10; R(fc, x, 92 - hh, 8, hh + 20); });
    else if (far === 1) layer(.08, 22, (x, i) => { const hh = 30 + Math.floor(rnd(i + f) * 40); R(fc, x + 6, 98 - hh, 10, hh); tri(x + 4, 98 - hh - 14, 14, 14, fc); });
    else if (far === 2) layer(.06, 90, (x, i) => { const y = 24 + Math.floor(rnd(i + f) * 30), w = 24 + Math.floor(rnd(i * 2 + f) * 30); R(fc, x, y, w, 4); vtri(x, y + 4, w, 12, fc2); });
    else if (far === 3) layer(.07, 40, (x, i) => { const hh = 20 + Math.floor(rnd(i + f) * 30), w = 24 + Math.floor(rnd(i * 3 + f) * 12); R(fc, x, 98 - hh, w, hh); R(fc2, x, 98 - hh, w, 2); });
    else layer(.1, 20, (x, i) => { const hh = 24 + Math.floor(rnd(i + f) * 46); R(fc, x, 98 - hh, 18, hh); if (tod) for (let wy = 98 - hh + 4; wy < 94; wy += 6) if (rnd(i * 5 + wy + f) > .6) R(win, x + 4 + (wy % 8), wy, 3, 2); });
    R(fc2, 0, 96, W, GROUND - 96);
    // 中景
    layer(.45, 50, (x, i) => {
      const r = rnd(i * 7 + f), X = x + 10 + Math.floor(r * 20);
      if (mid === 0){ R(mc, X + 8, GROUND - 16, 4, 16); circ(X + 10, GROUND - 26, 10 + Math.floor(r * 4), mc2); circ(X + 6, GROUND - 30, 4, acc); }
      else if (mid === 1){ R(mc, X + 8, GROUND - 8, 3, 8); tri(X, GROUND - 40, 19, 18, mc2); tri(X - 2, GROUND - 28, 23, 20, mc); }
      else if (mid === 2){ R("#efe6d6", X + 8, GROUND - 20, 6, 20); circ(X + 11, GROUND - 22, 12, acc); R(fc2, X - 2, GROUND - 22, 26, 13); R("#efe6d6", X + 8, GROUND - 22, 6, 2); R("#ffffff", X + 5, GROUND - 30, 3, 3); R("#ffffff", X + 14, GROUND - 28, 3, 3); }
      else if (mid === 3){ const hh = 16 + Math.floor(r * 22); g.globalAlpha = .2; circ(X + 6, GROUND - hh / 2, 12, acc); g.globalAlpha = 1; tri(X, GROUND - hh, 12, hh, acc); tri(X + 4, GROUND - hh + 4, 4, hh - 4, "#ffffff"); tri(X + 10, Math.round(GROUND - hh * .6), 8, Math.round(hh * .6), mc2); }
      else if (mid === 4){ const hh = 18 + Math.floor(r * 24); R(mc2, X, GROUND - hh, 10, hh); R(mc, X + 8, GROUND - hh, 2, hh); R(mc2, X - 2, GROUND - hh - 3, 14, 3); if (r > .5) R(mc2, X + 14, GROUND - 6, 10, 6); }
      else if (mid === 5){ const hh = 10 + Math.floor(r * 18); tri(X, GROUND - hh, 26, hh, mc2); tri(X + 14, GROUND - hh + 6, 18, hh - 6, mc); }
      else { R(mc2, X, GROUND - 18, 24, 18); tri(X - 3, GROUND - 30, 30, 12, mc); R(tod ? win : "#ffffff", X + 4, GROUND - 13, 5, 5); R(mc, X + 14, GROUND - 12, 6, 12); }
    });
    // 地面
    R(gc, 0, GROUND, W, H); R(gtop, 0, GROUND, W, gr === 0 ? 4 : 2);
    if (gr === 0) layer(1, 14, (x, i) => R(gc2, x + Math.floor(rnd(i + f) * 10), GROUND + 8 + Math.floor(rnd(i * 3 + f) * 20), 3, 2));
    else if (gr === 1){ layer(1, 20, x => R(gc2, x, GROUND + 2, 1, 30)); R(gc2, 0, GROUND + 14, W, 1); }
    else if (gr === 2) layer(1, 18, (x, i) => R(gc2, x, GROUND + 6 + m3(i) * 8, 10, 1));
    else if (gr === 3) layer(1, 12, (x, i) => R(gc2, x + Math.floor(rnd(i) * 8), GROUND + 6 + Math.floor(rnd(i + 2) * 22), 3, 1));
    else if (gr === 4){ layer(1, 8, x => R(gc2, x, GROUND, 1, 12)); R(gc2, 0, GROUND + 12, W, 2); R(fc2, 0, GROUND + 14, W, H); }
    else { for (let r = 0; r < 4; r++){ const off = ((G.scroll + (r % 2) * 8) % 16 + 16) % 16; for (let x = -16; x < W + 16; x += 16) R(gc2, x - off, GROUND + 2 + r * 8, 1, 8); R(gc2, 0, GROUND + 9 + r * 8, W, 1); } layer(1, 22, (x, i) => { if (rnd(i + f) > .5) R(hsl(110, 40, L(40, 30, 20)), x + 4, GROUND + 2, 6, 2); }); }
    // 天氣
    if (wx === 1) parts(40, P_SNOW, { vy: 14, vx: -6, par: .6 });
    else if (wx === 2) parts(50, P_RAIN, { vy: 120, vx: -20, par: .6 });
    else if (wx === 3) parts(26, P_PETAL, { vy: 14, vx: -16, par: .9 });
    else if (wx === 4) parts(18, P_FIRE, { vy: 3, vx: 4, par: .5 });
    else if (wx === 5) parts(24, P_EMBER, { vy: -16, vx: 3, par: .6 });
  }};
  return (GEN.cache[f] = sc);
}
// 每個場景配的背景音樂；第 23 關以後的未知領域輪流用各種曲子
const BGM_OF = { studio: "field", street: "field", oldstreet: "field", nightmarket: "festival", temple: "festival", mrt: "field", ricefield: "pastoral",
  school: "pastoral", rooftop: "field", shrine: "japan", festival: "festival", summer: "pastoral", onsen: "japan", snowtown: "japan", forest: "pastoral",
  desert: "fantasy", volcano: "fantasy", underwater: "fantasy", icecave: "fantasy", skycity: "fantasy", dungeon: "dark", demoncastle: "dark" };
const GEN_BGM = ["fantasy", "field", "pastoral", "festival", "japan", "dark"];
const bgmFor = f => f <= HAND.length ? (BGM_OF[HAND[f - 1]] || "field") : GEN_BGM[f % GEN_BGM.length];
const bossBgmFor = f => (f === HAND.length || (f > HAND.length && f % 10 === 0)) ? "final" : "boss";   // 魔王城和之後每 10 關的頭目用魔王曲
function sceneFor(floor){ return floor <= HAND.length ? BGS[HAND[floor - 1]] : genScene(floor); }


function draw(){
  g.imageSmoothingEnabled = false;
  HOOK.emit("drawStart");
  sceneFor(SAVE.floor).draw();
  HOOK.emit("drawBg");
  // 主角隊伍：鳳梨索在後、二百五在前
  const f = G.moving ? Math.floor(G.t * 7) % 2 : 0, flash = G.heroHurt > 0 && Math.floor(G.heroHurt * 14) % 2;
  const sx = G.heroHurt > 0 ? Math.round(Math.sin(G.heroHurt * 40) * 2) : 0;
  const hop = G.phase === "clear" ? Math.round(Math.abs(Math.sin(G.clearT * 7)) * 5) : 0, sink = G.down ? Math.round(G.down * 5) : 0;
  if (!(G.down >= 1 && Math.floor(G.t * 3) % 2)){
    sprite(PAL[f], PAL_X - 12 + sx, GROUND - 32 - (G.phase === "clear" ? Math.round(Math.abs(Math.sin(G.clearT * 7 + 1)) * 5) : 0) + sink, 2, flash);
    sprite(HERO[f], HERO_X - 12 + Math.round(lunge(G.heroLunge)) + sx, GROUND - 32 - hop + sink, 2, flash);
  }
  if (G.levelUp > 0){ g.fillStyle = "#fee761"; for (let i = 0; i < 6; i++){ const a = i * 1.05 + G.levelUp * 4; g.fillRect(Math.round(HERO_X - 12 + Math.cos(a) * 26), Math.round(GROUND - 18 + Math.sin(a) * 20), 2, 2); } }
  const m = G.mon;                                                         // 怪物
  if (m && !(m.dead && Math.floor(m.dead * 12) % 2)){
    const map = MON[m.type], s = m.boss ? 3 : 2, w = map[0].length * s, h = map.length * s;
    const fly = FLYING[m.type] ? 10 + Math.round(Math.sin(G.t * 4) * 3) : 0;
    const squash = !FLYING[m.type] && Math.floor(G.t * 3) % 2 ? 1 : 0;
    const mx = Math.round(m.x - w / 2 - lunge(G.monLunge) * 2.2 + (m.hurt > 0 ? Math.sin(m.hurt * 40) * 3 : 0));
    const my = Math.round(GROUND - h - fly + squash + (m.dead ? m.dead * 6 : 0));
    sprite(map, mx, my, s, m.hurt > 0.6);
    if (m.boss) sprite(CROWN, mx + w / 2 - 7, my - 7, 2, false);
    const bx = Math.round(mx + w / 2), by = my - (m.boss ? 14 : 7);
    g.fillStyle = "#000"; g.fillRect(bx - 16, by, 32, 4); g.fillStyle = "#e43b44"; g.fillRect(bx - 15, by + 1, Math.max(0, Math.round(30 * m.hp / m.max)), 2);
  }
  if (G.chest){                                                            // 寶箱：落地後打開、冒出光點
    const c = G.chest, open = c.t > .45, cx = Math.round(c.x - 8), cy = GROUND - 12 - (c.t < .3 ? Math.round((.3 - c.t) * 60) : 0);
    sprite(open ? CHEST[1] : CHEST[0], cx, cy, 2, false);
    if (open){ g.fillStyle = "#fee761"; for (let k = 0; k < 6; k++){ const a = k * 1.05 + c.t * 3, r = 6 + (c.t - .45) * 30; g.fillRect(Math.round(c.x + Math.cos(a) * r), Math.round(cy - 2 + Math.sin(a) * r * .6 - (c.t - .45) * 14), 2, 2); } }
  }
  if (G.combo > 1){                                                        // 連擊數
    const pulse = G.comboT > 0 ? 1 + G.comboT * .15 : 1, crit = G.combo >= critAt();
    g.font = `${Math.round(8 * pulse)}px "Press Start 2P",monospace`; g.textAlign = "left"; g.textBaseline = "top";
    const t = G.combo + " COMBO"; g.fillStyle = "#000"; [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1]].forEach(([dx, dy]) => g.fillText(t, 6 + dx, 6 + dy));
    g.fillStyle = crit ? "#ff7b1c" : "#fee761"; g.fillText(t, 6, 6);
  }
  if (G.hit){ g.fillStyle = G.hit.big ? "#ffd166" : "#fff"; const r = (G.hit.big ? 6 : 4) + G.hit.t * (G.hit.big ? 44 : 30); for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4; g.fillRect(Math.round(G.hit.x + Math.cos(a) * r), Math.round(G.hit.y + Math.sin(a) * r), 3, 3); } }
  HOOK.emit("drawFx");
  g.font = '8px "Press Start 2P",monospace'; g.textAlign = "center"; g.textBaseline = "alphabetic";
  G.fx.forEach(fx => { const x = Math.round(Math.max(30, fx.x)), y = Math.round(fx.y - fx.t * 18);
    g.fillStyle = "#000"; [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1]].forEach(([dx, dy]) => g.fillText(fx.text, x + dx, y + dy)); g.fillStyle = fx.color; g.fillText(fx.text, x, y); });
  HOOK.emit("drawEnd");
}
function makeIcons(){
  Object.entries(ITEM_ART).forEach(([id, map]) => { const c = document.createElement("canvas"); c.width = 8; c.height = 8; const x = c.getContext("2d");
    map.forEach((row, r) => [...row].forEach((ch, k) => { if (ch === ".") return; x.fillStyle = C[ch]; x.fillRect(k, r, 1, 1); })); ICON[id] = c.toDataURL(); });
}
function checkSprites(){
  [HERO, PAL].forEach(fr => fr.forEach(mp => mp.forEach(r => { if (r.length !== 12) console.error("角色圖有一列長度不對", r); })));
  Object.entries(MON).forEach(([k, mp]) => mp.forEach(r => { if (r.length !== 16) console.error("怪物圖有一列長度不對", k, r); }));
}

let last = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(RMOTION ? dt * 3 : dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- 匿名答錯率統計（GoatCounter，只有節目帳號登入後台才看得到；config.json 的 goatcounter 空白就不統計） ---------- */
function loadCounter(code){
  if (!code || !/^[a-z0-9-]+$/i.test(code)) return;
  const s = document.createElement("script"); s.async = true; s.src = "https://gc.zgo.at/count.js";
  s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
  s.dataset.goatcounterSettings = JSON.stringify({ no_onload: true });                  // 不記瀏覽人次
  document.head.appendChild(s);
}
function countAnswer(q, ok){
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: `QA大冒險/${ok ? "答對" : "答錯"}/${q.id}`, title: q.q.slice(0, 60), event: true }); } catch (e) {}
}

/* =====================================================================
   動漫梗特效（只用遊戲事件 HOOK，不影響遊戲規則）
   - 怪物出現時，兩人頭上冒出「！」
   - 升級時，二百五和鳳梨索身上各出現一道光柱
   ===================================================================== */
const TROPE = (() => {
  const S = { bang: 0, pillar: 0 };
  const BANG = ["TT", "TT", "TT", "TT", "..", "TT"];
  function mini(map, x, y, s){                                          // 小圖＋黑色描邊
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++)
      if (map[r][c] !== "."){ g.fillStyle = "#1b1a18"; g.fillRect(Math.round(x + (c + dx) * s), Math.round(y + (r + dy) * s), s, s); }
    sprite(map, x, y, s, false);
  }
  function drawFx(){
    if (S.pillar > 0){                                                  // 升級光柱（二百五和鳳梨索各一道）
      for (const X of [PAL_X, HERO_X]){
        g.globalAlpha = Math.min(1, S.pillar) * .35; R("#fff6c4", X - 10, 0, 20, GROUND); R("#ffffff", X - 4, 0, 8, GROUND); g.globalAlpha = 1;
        for (let k = 0; k < 8; k++){ const yy = GROUND - ((G.t * 60 + k * 17 + X) % GROUND); R("#ffe45c", X - 9 + (k * 7) % 18, yy, 2, 2); }
      }
    }
    if (S.bang > 0 && !G.down){                                         // 頭上的「！」
      const bob = Math.round(Math.sin(G.t * 6));
      mini(BANG, PAL_X - 1, GROUND - 46 + bob, 2); mini(BANG, HERO_X - 1, GROUND - 46 - bob, 2);
    }
  }
  HOOK.on((ev, a) => {
    if (ev === "spawn") S.bang = .9;
    else if (ev === "levelup") S.pillar = 1.6;
    else if (ev === "floor") S.bang = S.pillar = 0;
    else if (ev === "update"){ S.bang = Math.max(0, S.bang - a); S.pillar = Math.max(0, S.pillar - a); }
    else if (ev === "drawFx") drawFx();
  });
  return { S };
})();

/* ---------- 載入題庫 ---------- */
fetch("questions.json?v=" + Math.floor(Date.now() / 3600000)).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  QUESTIONS = (d.questions || []).filter(q => q && q.q && Array.isArray(q.a) && q.a.length === 4);
  if (!QUESTIONS.length) throw 0;
  DB = d; loadCounter(d.gc); if (d.built) $("#built").textContent = "・題庫更新：" + d.built + (d.pending ? `（其中 ${d.pending} 題主持人還在審核中）` : "");
  checkSprites(); makeIcons(); title(); requestAnimationFrame(frame);
}).catch(() => { say('<p class="sub">題庫還在準備中，晚點再來！</p>'); });
